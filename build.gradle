plugins { id 'com.android.application' version '8.2.0' }

android {
    namespace 'ru.local.pulsreceiver'
    compileSdk 34
    defaultConfig {
        applicationId 'ru.local.pulsreceiver'
        // Android 7.0 and newer: the HTTP listener and the foreground service run without extra libraries.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    lint { abortOnError true }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    testImplementation 'junit:junit:4.13.2'
}
