plugins { id 'com.android.application' version '8.2.0' }

android {
    namespace 'ru.local.pulsreceiver'
    compileSdk 34
    defaultConfig {
        applicationId 'ru.local.pulsreceiver'
        // Android 6.0 and newer: DOOGEE X5pro runs Android 6.0 (API 23)
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '1.7'
        // Подстройка под DOOGEE X5pro: архитектура armeabi-v7a (32-bit ARM)
        ndk {
            abiFilters 'armeabi-v7a', 'armeabi'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    lint { abortOnError true }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    testImplementation 'junit:junit:4.13.2'
}
